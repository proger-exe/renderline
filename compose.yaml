services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: renderline
      POSTGRES_PASSWORD: renderline
      POSTGRES_DB: renderline
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renderline"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: renderline
      RABBITMQ_DEFAULT_PASS: renderline
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    mem_limit: 256m

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    command: python bot/main.py
    volumes:
      - ./storage:/app/storage
    depends_on: [api]
    mem_limit: 256m

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: python worker/main.py
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    mem_limit: 768m

volumes:
  postgres_data:
  rabbitmq_data:
